<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Cert Jenna</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5c35'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='28' font-weight='700' text-anchor='middle' fill='%23171717'%3ECJ%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      place-items: center;
      color: #171717;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 92, 53, 0.2), transparent 27rem),
        radial-gradient(circle at 88% 18%, rgba(186, 242, 208, 0.65), transparent 24rem),
        #f3efe5;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      text-align: center;
    }

    .card {
      max-width: 34rem;
      padding: 2rem 1.75rem;
      border: 2px solid #171717;
      border-radius: 26px;
      background: #fffdf7;
      box-shadow: 10px 10px 0 #171717;
    }

    .badge {
      display: inline-block;
      padding: 0.3rem 0.68rem;
      border: 1.5px solid #171717;
      border-radius: 999px;
      background: #ffe1d7;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 1rem 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: -0.05em;
      line-height: 1;
    }

    p {
      margin: 0.9rem 0 0;
      color: #68645b;
    }

    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.8rem 1.1rem;
      border: 2px solid #171717;
      border-radius: 16px;
      background: #ff5c35;
      box-shadow: 4px 4px 0 #171717;
      color: #171717;
      font-weight: 900;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #171717;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="badge">404</p>
    <h1>Unsigned path</h1>
    <p>This URL isn't on the path you are supposed to be. The generator itself is still one click away.</p>
    <a href="https://bitbronze.github.io/cert-jenna/">Back to Cert Jenna</a>
  </main>
</body>
</html>
